<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Bus - Flying Audit Form</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ═══ HEADER — RESPONSIVE & BREATHABLE ═══ */
        :root { --header-height: 80px; }

        .app-header {
            height: var(--header-height);
            min-height: var(--header-height);
            padding: 0 1rem;
            border-bottom: 2px solid var(--accent);
            box-sizing: border-box;
        }

        /* Logo */
        .brand-logo {
            height: clamp(50px, 8vw, 70px);
            width: auto;
            display: block;
            flex-shrink: 0;
            object-fit: contain;
        }

        /* ═══ HEADER FLEX LAYOUT ═══ */
        .header-content-compact {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            width: 100%;
            gap: 0.75rem;
            height: 100%;
        }
        .header-left {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
        }
        .header-center {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header-actions-right {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ═══ TITLE — ALWAYS ONE LINE ═══ */
        .header-title-compact {
            font-size: clamp(0.75rem, 2.5vw, 1.1rem);
            font-weight: 800;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            width: 100%;
            text-align: center;
            line-height: 1.2;
        }

        #motivational-msg {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
        }

        /* ═══ TABLET SCREENS (<=768px) ═══ */
        @media (max-width: 768px) {
            :root { --header-height: 52px; }
            .brand-logo { height: 26px; }
            .progress-container-compact { width: 100px; margin-right: 0.25rem; }
            .motivational-msg, #motivational-msg { display: none; }
        }

        /* ═══ PHONE SCREENS (<= 480px) ═══ */
        @media (max-width: 480px) {
            :root { --header-height: 48px; }
            .brand-logo { height: 22px; }
            .header-title-compact { font-size: clamp(0.6rem, 3.5vw, 0.85rem); }
            .progress-container-compact { display: none; }
            .header-content-compact { gap: 0.4rem; }
        }
    </style>
</head>

<body>
    <div id="app">
        <header class="app-header">
            <div class="header-content-compact">
                <div class="header-left">
                    <img src="logo.webp" alt="FreshBus Logo" class="brand-logo">
                </div>

                <div class="header-center">
                    <h1 class="header-title-compact">Flying Audit Form</h1>
                </div>

                <div class="header-actions-right">
                    <div class="progress-container-compact" id="header-progress">
                        <div class="progress-stats">
                            <span id="progress-percent">0%</span>
                            <span id="progress-text">Sec 1/13</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="progress-bar-fill"></div>
                        </div>
                        <div id="motivational-msg"></div>
                    </div>


                    <button id="btn-autofill" class="btn btn-primary" style="margin-right: 10px; font-size: 0.8rem; padding: 4px 12px; height: 36px;">
                        <i class="fa-solid fa-magic"></i> Auto-Fill
                    </button>
                    <button id="mobile-menu-btn" class="mobile-menu-btn" title="Toggle Menu" style="display: none;">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <button id="theme-toggle" class="theme-toggle" title="Toggle Dark/Light Mode">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="app-body">
            <nav class="horizontal-nav" id="horizontal-nav">
                <ul id="section-menu" class="section-menu">
                    <!-- Injected by JS -->
                </ul>
            </nav>

            <main class="form-container" id="main-content">
                <form id="audit-form" novalidate>
                    <!-- Sections will be injected here by JS -->
                    <div id="section-render"></div>
                </form>
            </main>
            <footer class="app-footer" id="app-footer">
                <div class="nav-buttons">
                    <button type="button" id="btn-back" class="btn btn-secondary btn-compact">
                        <i class="fa-solid fa-arrow-left"></i> Back
                    </button>
                    <div class="spacer"></div>
                    <button type="button" id="btn-next" class="btn btn-primary btn-compact">
                        Next <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <button type="button" id="btn-submit" class="btn btn-submit btn-compact">
                        Submit Audit <i class="fa-solid fa-check-double"></i>
                    </button>
                </div>
            </footer>
        </div>

        <!-- Preview Modal -->
        <div id="preview-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2>Review Your Audit</h2>
                <div id="preview-data"></div>
                <div class="modal-actions">
                    <button id="confirm-submit" class="btn btn-submit">Confirm & Finalize</button>
                </div>
            </div>
        </div>

        <!-- Success Message -->
        <div id="success-screen" class="success-screen" style="display: none;">
            <div class="success-content">
                <div class="success-icon">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h1>Outstanding Job!</h1>
                <p>Your mystery ride audit has been successfully submitted.</p>
                <div class="reward-info">
                    <p>Wait for the audit results and rewards. Our customer care will be reaching out to you in 48 hrs
                        if you are eligible for the reward.</p>
                </div>
                <button onclick="location.reload()" class="btn btn-primary">Submit Another</button>
            </div>
        </div>

        <!-- Auto-save notification -->
        <div id="autosave-toast" class="toast">Draft Saved <i class="fa-solid fa-cloud-arrow-up"></i></div>
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
